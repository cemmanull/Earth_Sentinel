<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">

  <!-- outer orbital ring -->
  <circle
    cx="256"
    cy="256"
    r="180"
    stroke="#00575c"
    stroke-width="6"
    opacity="0.9"
  />

  <!-- signal ring -->
  <circle
    cx="256"
    cy="256"
    r="132"
    stroke="#154f84"
    stroke-width="3"
    stroke-dasharray="12 8"
    opacity="0.9"
  />

  <!-- inner pulse -->
  <circle
    cx="256"
    cy="256"
    r="78"
    stroke="#154f84"
    stroke-width="2"
    opacity="0.35"
  />

  <!-- central core -->
  <circle
    cx="256"
    cy="256"
    r="16"
    fill="#0d9297"
  />

  <!-- cardinal axis -->
  <line
    x1="256"
    y1="192"
    x2="256"
    y2="320"
    stroke="#00575c"
    stroke-width="5"
    stroke-linecap="round"
  />

  <line
    x1="192"
    y1="256"
    x2="320"
    y2="256"
    stroke="#00575c"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- diagonal telemetry -->
  <line
    x1="212"
    y1="212"
    x2="300"
    y2="300"
    stroke="#154f84"
    stroke-width="4"
    stroke-linecap="round"
  />

  <line
    x1="300"
    y1="212"
    x2="212"
    y2="300"
    stroke="#154f84"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- detection nodes -->
  <circle cx="256" cy="124" r="9" fill="#5e3a00"/>
  <circle cx="388" cy="256" r="9" fill="#5e3a00"/>
  <circle cx="256" cy="388" r="9" fill="#5e3a00"/>
  <circle cx="124" cy="256" r="9" fill="#5e3a00"/>

</svg>