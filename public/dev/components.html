<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Sentinel — Galeria de Componentes</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/panels.css">
  <link rel="stylesheet" href="/css/loader.css">
  <link rel="stylesheet" href="/css/risk-panel.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    body { overflow: auto; padding: 0; }
    .gallery {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 80px;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }
    .gallery-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--tx-1);
      border-bottom: 1px solid var(--bd-2);
      padding-bottom: 12px;
    }
    .gallery-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .gallery-section-title {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--tx-3);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .demo-btn {
      padding: 8px 20px;
      background: var(--ac);
      color: #fff;
      border: none;
      border-radius: var(--r-md);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity var(--t);
    }
    .demo-btn:hover { opacity: 0.85; }
    .sev-row {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .sev-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.625rem;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

<div class="gallery">
  <h1 class="gallery-title">Earth Sentinel — Galeria de Componentes</h1>

  <!-- ── TYPE-BADGE ─────────────────────────────────────────────────────── -->
  <section class="gallery-section">
    <h2 class="gallery-section-title">type-badge — todos os 26 tipos</h2>
    <div class="row" id="badgesContainer"></div>
  </section>

  <!-- ── SEVERITY-INDICATOR ────────────────────────────────────────────── -->
  <section class="gallery-section">
    <h2 class="gallery-section-title">severity-indicator — valores 1–5</h2>
    <div class="sev-row" id="sevContainer"></div>
  </section>

  <!-- ── METRIC-CHIP ───────────────────────────────────────────────────── -->
  <section class="gallery-section">
    <h2 class="gallery-section-title">metric-chip — níveis ok / warn / alert</h2>
    <div class="row">
      <metric-chip label="KP"   value="1.3" level="ok"></metric-chip>
      <metric-chip label="KP"   value="5.0" level="warn"></metric-chip>
      <metric-chip label="KP"   value="8.7" level="alert"></metric-chip>
      <metric-chip label="Mag." value="6.2"></metric-chip>
      <metric-chip label="Temp" value="38°C" level="warn"></metric-chip>
      <metric-chip label="IBOV" value="127.450" level="ok"></metric-chip>
    </div>
  </section>

  <!-- ── CONTENT-CARD ──────────────────────────────────────────────────── -->
  <section class="gallery-section">
    <h2 class="gallery-section-title">content-card — um por tema</h2>
    <div class="card-grid" id="cardsContainer"></div>
  </section>

  <!-- ── EMPTY-STATE ───────────────────────────────────────────────────── -->
  <section class="gallery-section">
    <h2 class="gallery-section-title">empty-state — com e sem ação</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px">
      <div style="background:var(--surf-2);border:1px solid var(--bd-2);border-radius:var(--r-md)">
        <empty-state icon="📭" message="Nenhum evento encontrado." action-label="Tentar de novo"></empty-state>
      </div>
      <div style="background:var(--surf-2);border:1px solid var(--bd-2);border-radius:var(--r-md)">
        <empty-state icon="📡" message="Sem conexão com o servidor."></empty-state>
      </div>
    </div>
  </section>

  <!-- ── APP-TOAST ─────────────────────────────────────────────────────── -->
  <section class="gallery-section">
    <h2 class="gallery-section-title">app-toast — disparo via botão e via evento app:toast</h2>
    <div class="row">
      <button class="demo-btn" id="btnToastSimple">Toast simples</button>
      <button class="demo-btn" id="btnToastAction">Toast com ação</button>
      <button class="demo-btn" id="btnToastEvent">Toast via app:toast</button>
    </div>
  </section>

</div>

<app-toast id="appToast"></app-toast>

<script type="module" src="/js/shared/components/index.js"></script>
<script type="module">
import { CONTENT_TYPE_META, THEME_TYPES } from '/js/shared/content-type-meta.js';

// ── type-badge: todos os 26 tipos ────────────────────────────────────────
const badgesContainer = document.getElementById('badgesContainer');
for (const type of Object.keys(CONTENT_TYPE_META)) {
  const el = document.createElement('type-badge');
  el.setAttribute('type', type);
  badgesContainer.appendChild(el);
}

// ── severity-indicator: 1–5 ──────────────────────────────────────────────
const sevContainer = document.getElementById('sevContainer');
for (let v = 1; v <= 5; v++) {
  const wrap = document.createElement('div');
  wrap.className = 'sev-item';
  const si = document.createElement('severity-indicator');
  si.setAttribute('value', String(v));
  const label = document.createElement('span');
  label.textContent = `Sev ${v}`;
  wrap.appendChild(si);
  wrap.appendChild(label);
  sevContainer.appendChild(wrap);
}

// ── content-card: um por tema ─────────────────────────────────────────────
const cardsContainer = document.getElementById('cardsContainer');

const CARD_SAMPLES = [
  {
    type: 'earthquake',
    title: 'M6.7 — Costa do Pacífico',
    desc: 'Terremoto de magnitude 6.7 registrado a 45 km de profundidade. Alerta de tsunami emitido para regiões costeiras.',
    meta: 'USGS · há 12 minutos',
    badge: '45 km',
    severity: 4,
  },
  {
    type: 'forecast',
    title: 'Chuvas intensas — Rio Grande do Sul',
    desc: 'Previsão de precipitação acumulada superior a 80 mm nas próximas 24 horas. Risco de alagamentos em áreas baixas.',
    meta: 'Open-Meteo · há 1 hora',
    badge: null,
    severity: 3,
  },
  {
    type: 'article',
    title: 'COP30: delegações definem metas de emissão',
    desc: 'Líderes mundiais chegam a acordo provisório sobre corte de emissões de carbono para 2035 durante conferência em Belém.',
    meta: 'GDELT · há 45 minutos',
    badge: null,
    severity: null,
  },
  {
    type: 'price_update',
    title: 'IBOVESPA — 127.450 pts',
    desc: 'Bolsa fecha em alta de 1,4% impulsionada por papéis do setor financeiro e de commodities.',
    meta: 'Stooq · 18:05',
    badge: '+1,4%',
    severity: null,
  },
];

for (const data of CARD_SAMPLES) {
  const card = document.createElement('content-card');
  card.data = data;
  card.addEventListener('card-click', (e) => {
    document.getElementById('appToast').show(
      `Card clicado: ${e.detail.data.title}`,
      { duration: 3000 }
    );
  });
  cardsContainer.appendChild(card);
}

// ── app-toast: botões de demonstração ────────────────────────────────────
const toast = document.getElementById('appToast');

document.getElementById('btnToastSimple').addEventListener('click', () => {
  toast.show('Feed de eventos extremos atualizado com 12 novos itens.', { duration: 4000 });
});

document.getElementById('btnToastAction').addEventListener('click', () => {
  toast.show('Falha ao carregar dados de clima. Verifique sua conexão.', {
    actionLabel: 'Tentar de novo',
    onAction: () => toast.show('Reconectando...', { duration: 2000 }),
    duration: 8000,
  });
});

document.getElementById('btnToastEvent').addEventListener('click', () => {
  document.dispatchEvent(new CustomEvent('app:toast', {
    detail: {
      message: 'Toast disparado via document app:toast event.',
      duration: 4000,
    },
  }));
});
</script>
</body>
</html>
