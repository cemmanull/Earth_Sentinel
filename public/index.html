<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Sentinel</title>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-600.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-700.woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/panels.css">
  <link rel="stylesheet" href="/css/loader.css">
  <link rel="stylesheet" href="/css/risk-panel.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/themes/extreme-events.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00575c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <!-- Iconografia (DESIGN.md): FA Free = ações utilitárias · Material Symbols = componentes -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body>

  <!-- Tela de carregamento -->
  <div id="loader" class="loader-overlay">
    <div class="loader-inner">
      <div class="loader-mark"><img src="/icons/brand.svg" alt="" class="loader-logo"></div>
      <p class="loader-title">Earth Sentinel</p>
      <p class="loader-sub">Preparando monitoramento global...</p>
      <div class="loader-track">
        <div class="loader-bar"></div>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app-shell">

    <!-- Header -->
    <header class="app-header">
      <div class="brand-group">
        <span class="brand-mark"><img src="/icons/brand.svg" alt="" class="brand-logo"></span>
        <span class="brand">Earth Sentinel</span>
        <span class="brand-sep"></span>
        <span class="subtitle">Monitoramento global de riscos</span>
      </div>
      <div class="header-actions">
        <!-- Seletor de tema — populado pelo shell a partir de /api/themes -->
        <select id="themeSelector" class="theme-selector" aria-label="Selecionar tema"></select>

        <button class="geo-btn" id="geoBtn"   title="Ir para minha localização" aria-label="Localização atual"><i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i></button>
        <button class="geo-btn" id="notifBtn" title="Configurar notificações"  aria-label="Notificações"><i class="fa-solid fa-bell" aria-hidden="true"></i></button>
        <button class="geo-btn" id="schemeBtn" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>

        <div class="view-switcher" role="group" aria-label="Vista">
          <button class="view-btn active" id="viewMap"   title="Mapa 2D"  aria-label="Mapa 2D"><i class="fa-solid fa-map" aria-hidden="true"></i></button>
          <button class="view-btn"        id="viewGlobe" title="Globo 3D" aria-label="Globo 3D"><i class="fa-solid fa-earth-americas" aria-hidden="true"></i></button>
        </div>

        <!-- Botão de camadas + popover (movido do painel lateral) -->
        <div class="layers-control">
          <button class="geo-btn" id="layersBtn" title="Camadas" aria-label="Camadas"><i class="fa-solid fa-layer-group" aria-hidden="true"></i></button>
          <div id="layersPopover" class="layers-popover">
            <div class="layers-popover-title">Camadas</div>
            <div class="layer-list">
              <button class="layer-toggle" data-layer="realistic">
                <span class="layer-icon"><i class="fa-solid fa-satellite" aria-hidden="true"></i></span>
                <span class="layer-name">Mapa Realista</span>
              </button>

              <div class="layer-sep">GIBS</div>

              <button class="layer-toggle" data-layer="fires">
                <span class="layer-icon"><i class="fa-solid fa-fire" aria-hidden="true"></i></span>
                <span class="layer-name">Incêndios</span>
              </button>
              <button class="layer-toggle" data-layer="temperature">
                <span class="layer-icon"><i class="fa-solid fa-temperature-half" aria-hidden="true"></i></span>
                <span class="layer-name">Temperatura</span>
              </button>
              <button class="layer-toggle" data-layer="clouds">
                <span class="layer-icon"><i class="fa-solid fa-cloud" aria-hidden="true"></i></span>
                <span class="layer-name">Nuvens</span>
              </button>
              <button class="layer-toggle" data-layer="aerosols">
                <span class="layer-icon"><i class="fa-solid fa-smog" aria-hidden="true"></i></span>
                <span class="layer-name">Aerossóis</span>
              </button>
            </div>
          </div>
        </div>

        <div class="status-pill" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status">Inicializando</span>
        </div>
      </div>
    </header>

    <main class="app-main">

      <!-- Mapa / Globo -->
      <section class="map-panel">
        <div id="mapContainer">
          <canvas id="globeCanvas"></canvas>
        </div>

        <!-- Filtro de período (map-overlay) — filtra marcadores por data.
             Mostrado pelo shell só para temas que implementam setDateRange. -->
        <div class="map-daterange" id="dateRange" hidden>
          <span class="mdr-cal" aria-hidden="true"><i class="fa-solid fa-calendar-day"></i></span>
          <input type="date" id="dateStart" class="mdr-input" aria-label="Data inicial">
          <span class="mdr-sep" aria-hidden="true">—</span>
          <input type="date" id="dateEnd" class="mdr-input" aria-label="Data final">
          <button type="button" id="dateClear" class="mdr-clear" aria-label="Limpar período" title="Limpar período" hidden>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <div class="map-hint" id="mapHint">Arraste para navegar · scroll para zoom</div>
      </section>

      <!-- Painel lateral — slot vazio; o tema ativo monta seu componente aqui -->
      <aside class="side-panel" id="sidePanel" aria-label="Painel do tema ativo">
        <button class="side-toggle" id="sideToggle" title="Recolher painel" aria-label="Recolher painel">
          <span class="side-toggle-icon">›</span>
        </button>
        <div class="side-scroll">
          <div id="themePanelSlot"></div>
        </div>
      </aside>

    </main>

    <!-- Ticker de eventos (bottom event stream — DESIGN.md) — preenchido pelo tema ativo -->
    <div class="ticker-strip" id="tickerStrip" aria-hidden="true">
      <div class="ticker-label">AO VIVO</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="tickerTrack"></div>
      </div>
    </div>
  </div>

  <!-- Painel de detalhe flutuante (compartilhado por todos os temas) -->
  <detail-panel id="detailPanel"></detail-panel>
  <!-- Container de toasts (compartilhado por todos os temas) -->
  <app-toast id="appToast"></app-toast>

  <!-- Modal de notificações -->
  <div id="notifModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">🔔 Notificações</span>
        <button class="modal-close" id="closeNotifModal" aria-label="Fechar"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
      <div class="modal-body">
        <div id="notifPermBanner" class="notif-perm-banner" hidden></div>
        <div id="notifRulesList" class="notif-rules-list"></div>
        <button id="addNotifRule" class="notif-add-btn">＋ Adicionar local</button>
      </div>
      <div class="modal-footer">
        <span class="notif-save-feedback" id="notifSaveFeedback"></span>
        <button class="notif-save-btn" id="saveNotifRules">Salvar configurações</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/shared/components/index.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
